<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-image: url('portada.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
    }
    /* Oculta el botón gigante nativo de EmulatorJS para que no estorbe */
    #game .ejs_start_button {
      opacity: 0 !important;
    }
    /* Tu botón personalizado: chico y en la parte inferior central */
    #btn-start {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      background-color: #dc2626;
      color: #ffffff;
      border: 2px solid #ffffff;
      border-radius: 6px;
      padding: 8px 18px;
      font-family: sans-serif;
      font-size: 14px;
      font-weight: bold;
      line-height: 1.2;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
    }
    #btn-start:active {
      transform: translateX(-50%) scale(0.96);
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <button id="btn-start" type="button">Start Game</button>

  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = new URL('pkm_y.gb', window.location.href).href;
    EJS_backgroundImage = new URL('portada.jpg', window.location.href).href;
    EJS_backgroundBlur = false;
    EJS_color = '#dc2626';
    EJS_startOnLoaded = false;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

    const btnStart = document.getElementById('btn-start');
    btnStart.addEventListener('click', () => {
      // Dispara el inicio real de EmulatorJS
      const ejsBtn = document.querySelector('#game .ejs_start_button, #game button');
      if (ejsBtn) ejsBtn.click();
      btnStart.style.display = 'none';
    });
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
