<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Pokémon Yellow</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      background-image: url('portada.jpg');
      background-position: center center;
      background-repeat: no-repeat;
      background-size: contain;
      overflow: hidden;
    }
    #game {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* Centra y hace compacto el botón inicial sin ocultarlo ni romper el canvas */
    #game .ejs_start_button,
    #game > div > button:only-child {
      position: absolute !important;
      top: 50% !important;
      left: 50% !important;
      transform: translate(-50%, -50%) !important;
      z-index: 9999 !important;
      width: auto !important;
      height: auto !important;
      min-width: unset !important;
      min-height: unset !important;
      background-color: #dc2626 !important;
      color: #ffffff !important;
      opacity: 1 !important;
      visibility: visible !important;
      border: 2px solid #ffffff !important;
      border-radius: 6px !important;
      padding: 10px 20px !important;
      font-size: 14px !important;
      font-weight: bold !important;
      line-height: 1.2 !important;
      cursor: pointer !important;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.9) !important;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <script>
    EJS_player = '#game';
    EJS_core = 'gb';
    EJS_gameUrl = new URL('pkmn_y.gb', window.location.href).href;
    EJS_backgroundImage = new URL('portada.jpg', window.location.href).href;
    EJS_backgroundBlur = false;
    EJS_color = '#dc2626';
    EJS_startOnLoaded = false;
    EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';
  </script>
  <script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>
</body>
</html>
